# The code checks, on every push to main and every pull request: the readability rules (ruff.toml), the type
# hints (pyright, pyrightconfig.json) and tools/readability.py's count of both against its baseline - the
# same checks the hook runs after every edit on a computer. The packs use Adventure Forever's code, so it's
# fetched beside this folder first. They read the code only: no ROM, no emulator, no secrets.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adventure Forever, beside this folder
        run: git clone --depth 1 https://github.com/majonesmax/adventure-forever.git ../adventure-forever
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Readability rules (ruff)
        run: ruff check --config ruff.toml .
      - name: Type hints (pyright)
        run: pyright --pythonpath "$(which python)"   # no .venv here: this machine's Python has the packages
      - name: No file got harder to read (tools/readability.py)
        run: python tools/readability.py
